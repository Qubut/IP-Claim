---
ssv_job_kind: ablate
ssv_job_devices:
  - nvidia.com/gpu=all
ssv_job_volumes: "{{ [
  ssv_hupd_host_root ~ ':/data/hupd:ro',
  ssv_output_host_root ~ ':/outputs:ro'
] + ssv_job_gpu_lib_volumes }}"
ssv_job_command:
  - python
  - -m
  - ip_claim.ssv
  - ablate-graph-prefix
  - --config
  - "{{ ssv_train_config }}"
  - --hupd-dir
  - /data/hupd
