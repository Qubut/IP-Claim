[defaults]
inventory = inventory/hosts.yml
roles_path = roles
# Prefer Galaxy ansible.posix>=2.2 over the copy bundled in the nix ansible package (2.1.0).
collections_path = ~/.config/ansible/collections:~/.ansible/collections
retry_files_enabled = False
host_key_checking = True
interpreter_python = auto_silent
stdout_callback = default
# Fail closed instead of sitting on a jump hop.
timeout = 15
# Do not dump vars that may contain ansible_password / tokens.
display_ok_hosts = True
display_skipped_hosts = True
# synchronize <2.2 spam; keep the play readable. Pin ansible.posix>=2.2 when upgrading.
deprecation_warnings = False

[privilege_escalation]
become = False

[ssh_connection]
# One mux per play. ControlMaster=no opened a new ProxyJump for every
# task and ServerAliveCountMax=240 kept a dead hop alive for an hour.
ssh_args = -o ControlMaster=auto -o ControlPersist=10m -o ControlPath=%d/.ansible/cp/%C -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -o TCPKeepAlive=yes -o IPQoS=throughput
pipelining = True
# Prefer sshpass when ansible_password is set (parent SSH_PASS pattern).
password_mechanism = sshpass
