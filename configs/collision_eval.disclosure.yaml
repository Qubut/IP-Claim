# Collision probe: chunk-and-sum disclosure into n_full.
# disclosure_max_chunks is the median window count (8) from the host
# disclosure histogram. Mean token mass past this cap is 0.196.
# New shard root. Do not reuse the first-window-only encode shards.

dataset: /data/epo-data/epo_hupd_dataset.parquet
hupd_dir: /data/hupd
output_dir: /outputs/collision-disclosure
checkpoint: /outputs/ssv
ssv_config: configs/ssv_train.prod.yaml
recall_k: [5, 10, 20, 50]
encode_batch_size: 64
dataloader_num_workers: 50
shard_flush_every: 50
prefix_mode: trunk
use_gpu: true
num_devices: 4
query_limit: null
disclosure_max_chunks: 8

covering:
  sigma: 1.0
  sigma_edge: 1.0
  lambda_relation: 0.0
  row_top_k: null
  row_mass_keep: null
  slot_top_k: null
  slot_mass_keep: null
contour_tau: 0.3
explain_top_n: 5
reuse_encode: false
rank_query_tile: 256

split:
  train: 0.6
  eval: 0.2
  test: 0.2
  seed: 42

publish_to_hub: false
hf_hub_repo_id: null
hf_hub_private: true
hf_hub_run_name: null
hf_token: ${oc.env:HF_TOKEN,${oc.env:HUGGING_FACE_HUB_TOKEN,''}}
